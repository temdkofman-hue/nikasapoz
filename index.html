<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nika Sapoz - Links</title>
    <!-- FontAwesome לאייקונים -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --card-bg: rgba(22, 27, 38, 0.65);
            --card-hover: rgba(35, 42, 58, 0.85);
            --accent-color: #53fc18; /* ירוק Kick */
            --purple-glow: rgba(157, 78, 221, 0.45);
            --text-color: #ffffff;
            --text-secondary: #c0c7d0;
            --border-color: rgba(255, 255, 255, 0.12);
            --border-hover: rgba(83, 252, 24, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0c10;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* וידאו רקע שמתנגן בלופים */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        /* שכבת הכהיה על הווידאו כדי שהטקסט והתיבה יהיו קריאים */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(10, 12, 16, 0.65), rgba(10, 12, 16, 0.85));
            z-index: 0;
            pointer-events: none;
        }

        /* אפקט הפנס הסגול העוקב אחרי העכבר */
        .cursor-flashlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--purple-glow) 0%, rgba(120, 50, 200, 0.15) 40%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: transform 0.05s ease-out;
            mix-blend-mode: screen;
        }

        /* התיבה/הריבוע המרכזי שעיטוף את הכל */
        .main-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            background: rgba(15, 18, 26, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 36px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(138, 43, 226, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 25px rgba(83, 252, 24, 0.4);
            transition: transform 0.3s ease;
            background-color: #161b22;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
        }

        .profile-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
            max-width: 95%;
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 14px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s ease-in-out;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(83, 252, 24, 0.2);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 1.3rem;
            width: 28px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* אייקון Kick מותאם מבוסס SVG */
        .kick-svg-icon {
            width: 20px;
            height: 20px;
            fill: #53fc18;
        }

        .socials-container {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .social-icon {
            color: var(--text-secondary);
            font-size: 1.5rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- סרטון רקע שרץ בלופים -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="bg1.mov" type="video/mp4">
        <source src="bg1.mov" type="video/quicktime">
    </video>
    <div class="video-overlay"></div>

    <!-- אלמנט הפנס הסגול העוקב -->
    <div class="cursor-flashlight" id="flashlight"></div>

    <!-- הריבוע המרכזי המקיף את כל הרכיבים -->
    <div class="main-wrapper">
        <!-- תמונת פרופיל מהקובץ avatar.jpg -->
        <img id="avatar" class="profile-avatar" src="avatar.jpg" alt="Nika Sapoz">
        
        <!-- שם וביו -->
        <h1 class="profile-title">Nika Sapoz</h1>
        <p class="profile-bio">היי קוראים לי ניקה ואני מסטרימה בקיק! מוזמנים לעקוב ולהצטרף לקהילה שלי ברשתות.</p>

        <!-- רשימת קישורים -->
        <div class="links-list">
            <!-- Kick -->
            <a href="https://kick.com/nikasapoz" target="_blank" class="link-card">
                <div class="link-content">
                    <span class="link-icon">
                        <!-- לוגו Kick רשמי -->
                        <svg class="kick-svg-icon" viewBox="0 0 24 24">
                            <path d="M3 3h6v5.25L13.5 3H21l-6.75 7.5L21 21h-7.5L9 15.75V21H3V3z"/>
                        </svg>
                    </span>
                    <span>Kick - הערוץ הרשמי שלי</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@nikasapoz" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-youtube link-icon" style="color: #ff0000;"></i>
                    <span>YouTube - הערוץ הרשמי</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- Discord -->
            <a href="https://discord.gg/tDYG8XZ6U4" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-discord link-icon" style="color: #5865F2;"></i>
                    <span>הצטרפו לשרת ה-Discord</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/veronika_sapoz/" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-instagram link-icon" style="color: #E1306C;"></i>
                    <span>Instagram</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>
        </div>

        <!-- כפתורי סושיאל קטנים -->
        <div class="socials-container">
            <a href="https://kick.com/nikasapoz" target="_blank" class="social-icon">
                <svg class="kick-svg-icon" viewBox="0 0 24 24" style="width: 22px; height: 22px;">
                    <path d="M3 3h6v5.25L13.5 3H21l-6.75 7.5L21 21h-7.5L9 15.75V21H3V3z"/>
                </svg>
            </a>
            <a href="https://www.youtube.com/@nikasapoz" target="_blank" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.instagram.com/veronika_sapoz/" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://discord.gg/tDYG8XZ6U4" target="_blank" class="social-icon"><i class="fa-brands fa-discord"></i></a>
        </div>

        <footer>
            <p>© Nika Sapoz | כל הזכויות שמורות</p>
        </footer>
    </div>

    <!-- סקריפט למעקב אחרי הסמן/העכבר -->
    <script>
        const flashlight = document.getElementById('flashlight');
        document.addEventListener('mousemove', (e) => {
            flashlight.style.left = e.clientX + 'px';
            flashlight.style.top = e.clientY + 'px';
        });
    </script>

</body>
</html>
