<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nika Sapoz - Links</title>
    <!-- FontAwesome לאייקונים -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1a2332 0%, #0b0e14 100%);
            --card-bg: rgba(22, 27, 34, 0.75);
            --card-hover: rgba(33, 38, 45, 0.9);
            --accent-color: #53fc18; /* ירוק Kick */
            --text-color: #ffffff;
            --text-secondary: #9da7b3;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(83, 252, 24, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 50px 16px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .profile-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 25px rgba(83, 252, 24, 0.3);
            transition: transform 0.3s ease;
            background-color: #161b22;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
        }

        .profile-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 1rem;
            text-align: center;
            line-height: 1.5;
            max-width: 90%;
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 14px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s ease-in-out;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(83, 252, 24, 0.15);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 1.4rem;
            width: 28px;
            text-align: center;
        }

        .socials-container {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .social-icon {
            color: var(--text-secondary);
            font-size: 1.6rem;
            transition: all 0.2s;
        }

        .social-icon:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- הלוגו האישי שלך בערוץ (מתוך היוטיוב והקיק) -->
    <img id="avatar" class="profile-avatar" src="https://yt3.googleusercontent.com/ytc/AIdro_k6K0jDqG8p2Y-XG_mXN7A6M0A5X2Y1=s176-c-k-c0x00ffffff-no-rj" alt="Nika Sapoz" onerror="this.src='https://files.kick.com/images/user/15317769/profile_image/conversion/66718420-b8c7-43c2-a9b0-27909eb62ff7-fullsize.webp';">
    
    <!-- שם וביו -->
    <h1 class="profile-title">Nika Sapoz</h1>
    <p class="profile-bio">היי קוראים לי ניקה ואני מסטרימה בקיק! מוזמנים לעקוב ולהצטרף לקהילה שלי ברשתות.</p>

    <!-- רשימת קישורים -->
    <div class="links-list">
        <!-- Kick -->
        <a href="https://kick.com/nikasapoz" target="_blank" class="link-card">
            <div class="link-content">
                <i class="fa-solid fa-headset link-icon" style="color: #53fc18;"></i>
                <span>Kick - הערוץ הרשמי שלי</span>
            </div>
            <i class="fa-solid fa-chevron-left"></i>
        </a>

        <!-- YouTube -->
        <a href="https://www.youtube.com/@nikasapoz" target="_blank" class="link-card">
            <div class="link-content">
                <i class="fa-brands fa-youtube link-icon" style="color: #ff0000;"></i>
                <span>YouTube - הערוץ הרשמי</span>
            </div>
            <i class="fa-solid fa-chevron-left"></i>
        </a>

        <!-- Discord -->
        <a href="https://discord.gg/tDYG8XZ6U4" target="_blank" class="link-card">
            <div class="link-content">
                <i class="fa-brands fa-discord link-icon" style="color: #5865F2;"></i>
                <span>הצטרפו לשרת ה-Discord</span>
            </div>
            <i class="fa-solid fa-chevron-left"></i>
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/veronika_sapoz/" target="_blank" class="link-card">
            <div class="link-content">
                <i class="fa-brands fa-instagram link-icon" style="color: #E1306C;"></i>
                <span>Instagram</span>
            </div>
            <i class="fa-solid fa-chevron-left"></i>
        </a>
    </div>

    <!-- כפתורי סושיאל קטנים -->
    <div class="socials-container">
        <a href="https://kick.com/nikasapoz" target="_blank" class="social-icon"><i class="fa-solid fa-headset"></i></a>
        <a href="https://www.youtube.com/@nikasapoz" target="_blank" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://www.instagram.com/veronika_sapoz/" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://discord.gg/tDYG8XZ6U4" target="_blank" class="social-icon"><i class="fa-brands fa-discord"></i></a>
    </div>

    <footer>
        <p>© Nika Sapoz | כל הזכויות שמורות</p>
    </footer>
</div>

</body>
</html>
