<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nika Sapoz - Links</title>
    <!-- FontAwesome לאייקונים -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --card-bg: rgba(22, 27, 38, 0.65);
            --card-hover: rgba(35, 42, 58, 0.85);
            --text-color: #ffffff;
            --text-secondary: #c0c7d0;
            --border-color: rgba(255, 255, 255, 0.12);
            --purple-glow: rgba(157, 78, 221, 0.45);

            /* צבעים ייחודיים לרשתות */
            --kick-color: #53fc18;
            --youtube-color: #ff0000;
            --discord-color: #5865F2;
            --instagram-color: #E1306C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0c10;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* וידאו רקע שמתנגן בלופים */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        /* שכבת הכהיה על הווידאו */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(10, 12, 16, 0.65), rgba(10, 12, 16, 0.85));
            z-index: 0;
            pointer-events: none;
        }

        /* אפקט הפנס הסגול העוקב אחרי העכבר */
        .cursor-flashlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--purple-glow) 0%, rgba(120, 50, 200, 0.15) 40%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: transform 0.05s ease-out;
            mix-blend-mode: screen;
        }

        /* התיבה/הריבוע המרכזי המוגדל */
        .main-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 580px; /* הוגדל ל-580px */
            background: rgba(15, 18, 26, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 48px 36px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(138, 43, 226, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* מעטפת האווטאר המוגדל */
        .avatar-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .profile-avatar {
            width: 180px; /* הוגדל ל-180px */
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--kick-color);
            box-shadow: 0 0 35px rgba(83, 252, 24, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: #161b22;
            display: block;
        }

        .avatar-container:hover .profile-avatar {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(83, 252, 24, 0.75);
        }

        /* באדג' STREAMING NOW - ממוקם למעלה ימינה ליד הלוגו */
        .live-badge {
            position: absolute;
            top: 6px;
            right: -10px;
            background-color: #ff0000;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.9);
            border: 2px solid #0a0c10;
            white-space: nowrap;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 3;
        }

        /* הסתרה קלה כשהלייב כבוי */
        .live-badge.hidden {
            display: none !important;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            animation: pulse-dot 1.2s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1); }
        }

        .profile-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-top: 5px;
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 1.05rem;
            text-align: center;
            line-height: 1.5;
            max-width: 95%;
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 10px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            border-radius: 18px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.25s ease-in-out;
        }

        /* אפקטי POPUP + צבעי זוהר ייחודיים בעת מעבר עכבר */
        
        /* Kick - ירוק */
        .link-card.kick:hover {
            background-color: var(--card-hover);
            border-color: rgba(83, 252, 24, 0.7);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(83, 252, 24, 0.4);
        }

        /* YouTube - אדום */
        .link-card.youtube:hover {
            background-color: var(--card-hover);
            border-color: rgba(255, 0, 0, 0.7);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 0, 0, 0.4);
        }

        /* Discord - כחול/סגול */
        .link-card.discord:hover {
            background-color: var(--card-hover);
            border-color: rgba(88, 101, 242, 0.7);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(88, 101, 242, 0.4);
        }

        /* Instagram - ורוד */
        .link-card.instagram:hover {
            background-color: var(--card-hover);
            border-color: rgba(225, 48, 108, 0.7);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(225, 48, 108, 0.4);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link-icon {
            font-size: 1.5rem;
            width: 30px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kick-svg-icon {
            width: 24px;
            height: 24px;
            fill: var(--kick-color);
        }

        .socials-container {
            display: flex;
            gap: 24px;
            margin-top: 10px;
        }

        .social-icon {
            color: var(--text-secondary);
            font-size: 1.7rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon:hover {
            color: var(--kick-color);
            transform: translateY(-3px) scale(1.1);
        }

        footer {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- סרטון רקע שרץ בלופים -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="bg1.mov" type="video/mp4">
        <source src="bg1.mov" type="video/quicktime">
    </video>
    <div class="video-overlay"></div>

    <!-- אלמנט הפנס הסגול העוקב -->
    <div class="cursor-flashlight" id="flashlight"></div>

    <!-- הריבוע המרכזי המוגדל -->
    <div class="main-wrapper">
        
        <!-- לוגו מוגדל שלחיצה עליו מעבירה ל-Kick + באדג' STREAMING NOW בפינה הימנית העליונה -->
        <a href="https://kick.com/nikasapoz" target="_blank" class="avatar-container">
            <img id="avatar" class="profile-avatar" src="avatar.jpg" alt="Nika Sapoz">
            
            <!-- באדג' לייב (להסתיר מתי שאינך בלייב, פשוט מוסיפים את הקלאס hidden) -->
            <div class="live-badge" id="liveBadge">
                <span class="live-dot"></span>
                STREAMING NOW
            </div>
        </a>
        
        <!-- שם וביו -->
        <h1 class="profile-title">Nika Sapoz</h1>
        <p class="profile-bio">היי קוראים לי ניקה ואני מסטרימה בקיק! מוזמנים לעקוב ולהצטרף לקהילה שלי ברשתות.</p>

        <!-- רשימת קישורים עם אפקט פופ-אפ וצבעי זוהר מותאמים -->
        <div class="links-list">
            <!-- Kick - ירוק -->
            <a href="https://kick.com/nikasapoz" target="_blank" class="link-card kick">
                <div class="link-content">
                    <span class="link-icon">
                        <svg class="kick-svg-icon" viewBox="0 0 24 24">
                            <path d="M3 3h6v5.25L13.5 3H21l-6.75 7.5L21 21h-7.5L9 15.75V21H3V3z"/>
                        </svg>
                    </span>
                    <span>Kick - הערוץ הרשמי שלי</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- YouTube - אדום -->
            <a href="https://www.youtube.com/@nikasapoz" target="_blank" class="link-card youtube">
                <div class="link-content">
                    <i class="fa-brands fa-youtube link-icon" style="color: #ff0000;"></i>
                    <span>YouTube - הערוץ הרשמי</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- Discord - כחול/סגול -->
            <a href="https://discord.gg/tDYG8XZ6U4" target="_blank" class="link-card discord">
                <div class="link-content">
                    <i class="fa-brands fa-discord link-icon" style="color: #5865F2;"></i>
                    <span>הצטרפו לשרת ה-Discord</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- Instagram - ורוד -->
            <a href="https://www.instagram.com/veronika_sapoz/" target="_blank" class="link-card instagram">
                <div class="link-content">
                    <i class="fa-brands fa-instagram link-icon" style="color: #E1306C;"></i>
                    <span>Instagram</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>
        </div>

        <!-- כפתורי סושיאל קטנים -->
        <div class="socials-container">
            <a href="https://kick.com/nikasapoz" target="_blank" class="social-icon">
                <svg class="kick-svg-icon" viewBox="0 0 24 24" style="width: 24px; height: 24px;">
                    <path d="M3 3h6v5.25L13.5 3H21l-6.75 7.5L21 21h-7.5L9 15.75V21H3V3z"/>
                </svg>
            </a>
            <a href="https://www.youtube.com/@nikasapoz" target="_blank" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.instagram.com/veronika_sapoz/" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://discord.gg/tDYG8XZ6U4" target="_blank" class="social-icon"><i class="fa-brands fa-discord"></i></a>
        </div>

        <footer>
            <p>© Nika Sapoz | כל הזכויות שמורות</p>
        </footer>
    </div>

    <!-- סקריפטים -->
    <script>
        // מעקב אחרי העכבר לאפקט פנס סגול
        const flashlight = document.getElementById('flashlight');
        document.addEventListener('mousemove', (e) => {
            flashlight.style.left = e.clientX + 'px';
            flashlight.style.top = e.clientY + 'px';
        });

        // הגדרת מצב לייב: 
        // לשנות ל-isLive = false כשאת לא בלייב כדי להסתיר את הבאדג'
        const isLive = true; 
        const liveBadge = document.getElementById('liveBadge');
        if (!isLive) {
            liveBadge.classList.add('hidden');
        }
    </script>

</body>
</html>
